name: Check Shopee Flash Sale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-shopee-flash-sale
  cancel-in-progress: true

jobs:
  check-flash-sale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Shopee flash sale products
        run: npm run check:flash-sale

      - name: Commit JSON result if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add shopee-flash-sale.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update Shopee flash sale data"
          git push
